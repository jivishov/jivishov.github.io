<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Redirecting to LLM.Journal</title>
    <script>
      (() => {
        const lowercaseBase = "/llm.journal";
        const canonicalBase = "/LLM.Journal";
        const path = window.location.pathname;

        if (
          path === lowercaseBase ||
          path.startsWith(`${lowercaseBase}/`)
        ) {
          const suffix = path.slice(lowercaseBase.length);
          window.location.replace(
            `${canonicalBase}${suffix}${window.location.search}${window.location.hash}`
          );
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>
        Looking for the LLM Journal?
        <a href="https://jivishov.github.io/LLM.Journal/">
          Open the active portfolio
        </a>.
      </p>
    </main>
  </body>
</html>
